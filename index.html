<script id="story-map-model">
/* Project-year is evaluated BEFORE story/facet filters, over all project members.
 * Story periods are ORed; facets are OR within each facet and AND across facets.
 * Filtering never recomputes completion or forces percentages to match statuses.
 */
globalThis.StoryMapModel=(()=>{
 const number=v=>v==null||v===''?null:Number.isFinite(Number(v))?Number(v):null;
 const text=v=>v==null?'':String(v).trim();
 const status=v=>text(v).toLocaleLowerCase('ru').replace(/\s+/g,' ');
 const lanes=new Map(Object.entries({done:'done','готово':'done',later:'backlog','later (бэклог)':'backlog',next:'backlog','next (в очереди)':'backlog',backlog:'backlog','бэклог':'backlog','в очереди':'backlog','in progress':'wip','in progress (в анализе)':'wip','в анализе':'wip','backlog it (передано ит)':'wip','change request':'wip','in progress it':'wip',testing:'wip','in review (опэ)':'wip',consultation:'wip','консультация':'wip','тестирование':'wip'}));
 const lane=v=>lanes.get(status(v))||'other';
 const monthKey=v=>/^\d{4}\.(0[1-9]|1[0-2])$/.test(text(v))?text(v):null;
 const tokens=v=>[...new Set(text(v).split(';').map(text).filter(Boolean))];
 const directions=v=>[...new Set(tokens(v).map(s=>s.split('|')[0].trim()).filter(Boolean))];
 const cmp=(a,b)=>(b.pct??-Infinity)-(a.pct??-Infinity)||a.title.localeCompare(b.title,'ru');
 const defaults=()=>({search:'',projectYear:'',periods:[],stakeholder:[],direction:[],stream:[],department:[],ba:[],project:[],projectMin:0,projectMax:100,epicMin:0,epicMax:100,hideCompleted:true,issuesOnly:false,orphanOnly:false,collapsed:{done:true,wip:false,backlog:false,other:false}});
 const positive=m=>monthKey(m.month)&&m.sp_utilized!==null&&m.sp_utilized>0;
 function inPeriod(month,period){if(!monthKey(month))return false;if(/^\d{4}\.Q[1-4]$/.test(period))return month.slice(0,4)===period.slice(0,4)&&Math.ceil(Number(month.slice(5))/3)===Number(period.at(-1));return month===period;}
 function build(data){
  if(data?.schema_version!==1||data.api_revision!==2||!Array.isArray(data.stories)||!Array.isArray(data.epics))throw new Error('Нужен обновлённый запрос Story Map v2 в ноде PostgreSQL. Замените SQL вебхука из комплекта.');
  const epics=new Map(),stories=new Map(),projects=new Map();
  for(const r of data.epics){const id=text(r.id);if(!/^\d+$/.test(id)||epics.has(id))throw new Error('Некорректный или повторный ID эпика.');epics.set(id,{...r,id,title:text(r.title)||'Название не загружено · #'+id,titleMissing:!text(r.title),project:text(r.project)||'Без проекта',sp:number(r.sp),used:number(r.sp_utilized),pct:number(r.ready)===null?null:number(r.ready)*100,stories:[],missing:false});}
  for(const r of data.stories){
   if(['stop','trash'].includes(status(r.status)))continue;
   const id=text(r.id);if(!/^\d+$/.test(id)||stories.has(id))throw new Error('Некорректный или повторный ID истории.');
   const eid=text(r.epic_id)||'unassigned';
   if(!epics.has(eid))epics.set(eid,{id:eid,title:eid==='unassigned'?'Без эпика':'Эпик #'+eid+' не загружен',titleMissing:true,project:'Без проекта',sp:null,used:null,pct:null,stories:[],missing:true});
   const e=epics.get(eid),months=(Array.isArray(r.months)?r.months:[]).map(m=>({...m,month:text(m.month),start:number(m.start),end:number(m.end),sp_utilized:number(m.sp_utilized),sp_ready:number(m.sp_ready)})).sort((a,b)=>(monthKey(a.month)||'').localeCompare(monthKey(b.month)||''));
   const s={...r,id,epic_id:eid,title:text(r.title)||'История #'+id,status:text(r.status),lane:lane(r.status),sp:number(r.sp_true),used:number(r.sp_utilized),pct:months.filter(m=>monthKey(m.month)).at(-1)?.end??null,months,project:e.project,issues:[],facets:{}};
   for(const k of ['stakeholder','stream','department','ba']){s[k]=text(r[k]);s.facets[k]=tokens(r[k]);}
   s.direction=text(r.direction);s.facets.direction=directions(r.direction);
   if(s.lane==='other')s.issues.push('Статус не сопоставлен с горизонталью: '+s.status);
   if(s.pct===null)s.issues.push('Нет месячного факта готовности');
   else if(s.pct<0||s.pct>100)s.issues.push('Готовность вне диапазона 0–100%');
   else if((s.lane==='done'&&s.pct!==100)||(s.lane==='backlog'&&s.pct!==0)||(s.lane==='wip'&&(s.pct===0||s.pct===100)))s.issues.push('Текущий статус и месячная готовность расходятся');
   if(s.sp===null)s.issues.push('Не рассчитан sp_true');
   if(months.some(m=>!monthKey(m.month)))s.issues.push('Некорректный месяц в факте');
   if(e.missing)s.issues.push(eid==='unassigned'?'Нет связи с эпиком':'Связанный эпик не загружен');
   s.search=[s.id,s.title,s.ba,s.project,e.title,e.code,e.reference].join(' ').toLocaleLowerCase('ru');
   stories.set(id,s);e.stories.push(s);
  }
  for(const e of epics.values()){e.stories.sort(cmp);if(!projects.has(e.project))projects.set(e.project,{id:e.project,title:e.project,epics:[],years:new Set()});const p=projects.get(e.project);p.epics.push(e);for(const s of e.stories)for(const m of s.months)if(positive(m))p.years.add(m.month.slice(0,4));}
  for(const p of projects.values()){p.epics.sort(cmp);const ok=p.epics.every(e=>e.sp!==null&&e.used!==null&&!e.missing);p.sp=ok?p.epics.reduce((n,e)=>n+e.sp,0):null;p.used=ok?p.epics.reduce((n,e)=>n+e.used,0):null;p.pct=p.sp>0?p.used/p.sp*100:null;}
  return {epics,stories,projects:[...projects.values()].sort(cmp),generatedAt:data.generated_at,meta:data.meta||{}};
 }
 function inRange(v,min,max){return v===null?(min===0&&max===100):v>=min&&v<=max;}
 function matches(s,f){return ['stakeholder','direction','stream','department','ba'].every(k=>!f[k].length||f[k].some(v=>s.facets[k].includes(v)))&&(!f.periods.length||s.months.some(m=>positive(m)&&f.periods.some(p=>inPeriod(m.month,p))))&&(!f.search||s.search.includes(f.search.trim().toLocaleLowerCase('ru')))&&(!f.issuesOnly||s.issues.length>0);}
 function groups(model,input={}){
  const f={...defaults(),...input};
  const narrowed=!!f.search||f.issuesOnly||f.periods.length||['stakeholder','direction','stream','department','ba'].some(k=>f[k].length);
  return model.projects.filter(p=>(!f.projectYear||p.years.has(f.projectYear))&&(!f.project.length||f.project.includes(p.id))&&(!f.hideCompleted||p.pct===null||Math.abs(p.pct-100)>1e-8)&&inRange(p.pct,f.projectMin,f.projectMax))
   .map(p=>({...p,epics:p.epics.filter(e=>(f.orphanOnly?e.id==='unassigned':e.id!=='unassigned')&&inRange(e.pct,f.epicMin,f.epicMax)).map(e=>({...e,visible:e.stories.filter(s=>matches(s,f))})).filter(e=>e.visible.length||(!narrowed&&!e.stories.length))})).filter(p=>p.epics.length);
 }
 function options(model,key){if(key==='projectYear')return [...new Set(model.projects.flatMap(p=>[...p.years]))].sort().reverse();if(key==='project')return model.projects.map(p=>p.id).sort((a,b)=>a.localeCompare(b,'ru'));if(key==='periods'){const months=[...new Set([...model.stories.values()].flatMap(s=>s.months.filter(positive).map(m=>m.month)))];return [...new Set(months.flatMap(m=>[m,m.slice(0,4)+'.Q'+Math.ceil(Number(m.slice(5))/3)]))].sort().reverse();}return [...new Set([...model.stories.values()].flatMap(s=>s.facets[key]||[]))].sort((a,b)=>a.localeCompare(b,'ru'));}
 return {build,groups,matches,defaults,options,lane,number,positive,inPeriod};
})();
</script>
<script id="story-map-app">
(()=>{
 const $=id=>document.getElementById(id),M=globalThis.StoryMapModel;
 const escape=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const fmt=v=>v==null?'—':new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1}).format(v);
 const percent=v=>v==null?'—':fmt(v)+'%';
 const date=v=>{if(!v)return'—';const d=new Date(v);return Number.isNaN(+d)?String(v):new Intl.DateTimeFormat('ru-RU',{dateStyle:'short',timeStyle:'short'}).format(d);};
 const periodLabel=p=>p.includes('.Q')?p.slice(0,4)+' · '+['I','II','III','IV'][Number(p.at(-1))-1]+' квартал':/^\d{4}\.\d{2}$/.test(p)?new Intl.DateTimeFormat('ru-RU',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(p.slice(0,4)+'-'+p.slice(5)+'-01T12:00:00Z')):p;
 const bar=(v,label)=>`<div class="progress"><div class="track" role="progressbar" aria-label="${escape(label)}" ${v==null?'':`aria-valuenow="${Math.max(0,Math.min(100,v))}"`} aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${v==null?0:Math.max(0,Math.min(100,v))}%"></div></div><span>${percent(v)}</span></div>`;
 const tabs={projectYear:'Год проектов',periods:'Период историй',stakeholder:'Стейкхолдер',direction:'Направление',stream:'Стрим',department:'Отдел',ba:'Аналитик',project:'Проект',readiness:'Готовность'};
 const state=M.defaults();let model=null,loading=false,draft=null,tab='stakeholder',optionSearch='',expanded=new Set(),viewGroups=[],viewEpics=[],windowKey='',raf=0,searchTimer;
 try{const saved=JSON.parse(localStorage.getItem('ubait-story-map-ui-v2')||'null');if(saved){for(const k of ['search','projectYear'])if(typeof saved[k]==='string')state[k]=saved[k];for(const k of ['periods','stakeholder','direction','stream','department','ba','project'])if(Array.isArray(saved[k]))state[k]=saved[k].filter(x=>typeof x==='string');for(const k of ['hideCompleted','issuesOnly','orphanOnly'])if(typeof saved[k]==='boolean')state[k]=saved[k];for(const k of ['projectMin','projectMax','epicMin','epicMax'])if(Number.isFinite(saved[k]))state[k]=Math.max(0,Math.min(100,saved[k]));for(const k of Object.keys(state.collapsed))if(typeof saved.collapsed?.[k]==='boolean')state.collapsed[k]=saved.collapsed[k];if(state.projectMin>state.projectMax)[state.projectMin,state.projectMax]=[state.projectMax,state.projectMin];if(state.epicMin>state.epicMax)[state.epicMin,state.epicMax]=[state.epicMax,state.epicMin];}}catch{}
 const save=()=>{try{localStorage.setItem('ubait-story-map-ui-v2',JSON.stringify(state));}catch{}};
 const hasChanges=()=>JSON.stringify(state)!==JSON.stringify(M.defaults());
 function card(s){return `<button class="story ${s.lane} ${s.issues.length?'has-issue':''}" data-story="${s.id}" aria-label="${escape(s.title)}, ${s.lane==='wip'?escape(s.status)+', ':''}${percent(s.pct)}">${s.issues.length?'<span class="issue-dot" aria-label="Есть замечания">●</span>':''}<span class="story-title">${escape(s.title)}</span>${s.lane==='wip'?`<span class="story-status" title="${escape(s.status)}">${escape(s.status)}</span>`:''}<span class="story-bottom"><span class="story-person">${escape(s.ba)||'Аналитик не указан'}</span><span class="story-stats"><span class="percent">${percent(s.pct)}</span><span>${fmt(s.sp)} SP</span></span></span></button>`;}
 function dimensions(){const css=getComputedStyle($('matrix'));return {col:parseFloat(css.getPropertyValue('--col'))||236,rail:parseFloat(css.getPropertyValue('--rail'))||76};}
 function renderWindow(force=false){
  if(!model||!viewEpics.length)return;
  const vp=$('viewport'),{col,rail}=dimensions(),lo=Math.max(0,Math.floor(vp.scrollLeft/col)-2),hi=Math.min(viewEpics.length,Math.ceil((vp.scrollLeft+vp.clientWidth)/col)+2);
  const key=lo+':'+hi;if(!force&&key===windowKey){syncScroll();return;}windowKey=key;
  const visible=viewEpics.slice(lo,hi),all=viewEpics.flatMap(e=>e.visible),laneDefs=[['done','Done'],['wip','WIP'],['backlog','Backlog']];if(all.some(s=>s.lane==='other'))laneDefs.push(['other','Другие']);
  const style=i=>`grid-column:${i+2};grid-row:1`;
  let offset=0;const heads=viewGroups.map(p=>{const start=offset;offset+=p.epics.length;const a=Math.max(start,lo),b=Math.min(offset,hi);return b>a?`<section class="project-head" style="grid-column:${a+2} / span ${b-a};grid-row:1" title="${escape(p.title)} · ${fmt(p.used)} / ${fmt(p.sp)} SP"><h2>${escape(p.title)}</h2><span class="percent">${percent(p.pct)}</span></section>`:'';}).join('');
  $('matrix').innerHTML=`<div class="map-head grid"><div class="head-rail">Эпики →<br>Истории ↓</div>${heads}${visible.map((e,j)=>`<button class="epic-head" style="grid-column:${lo+j+2};grid-row:2" data-epic="${escape(e.id)}" title="${escape(e.title)}"><span class="epic-code">${escape(e.code)||'Эпик'}</span><h3>${escape(e.title)}</h3>${bar(e.pct,'Готовность эпика')}</button>`).join('')}</div>${laneDefs.map(([id,name])=>{
   const count=all.filter(s=>s.lane===id).length,closed=state.collapsed[id];
   // A lane keeps the SAME height across horizontal windows: no jumps while scrolling.
   const maxCards=closed?0:Math.max(0,...viewEpics.map(e=>Math.min(expanded.has(id+':'+e.id)?Infinity:20,e.visible.filter(s=>s.lane===id).length)));
   const more= !closed&&viewEpics.some(e=>!expanded.has(id+':'+e.id)&&e.visible.filter(s=>s.lane===id).length>20);
   const height=closed?30:Math.max(42,20+maxCards*(id==='wip'?130:112)+(more?36:0));
   return `<section class="lane grid ${closed?'collapsed':''}" aria-label="${name}" style="min-height:${height}px"><div class="lane-rail" style="grid-column:1;grid-row:1"><button class="lane-toggle" data-lane="${id}" aria-expanded="${!closed}">${closed?'▸':'▾'} ${name}</button><div class="lane-note">${count}</div></div>${closed?'':visible.map((e,j)=>{const rows=e.visible.filter(s=>s.lane===id),k=id+':'+e.id,limit=expanded.has(k)?rows.length:20;return `<div class="cell ${rows.length?'':'empty'}" style="${style(lo+j)}">${rows.slice(0,limit).map(card).join('')}${rows.length>limit?`<button class="more" data-more="${escape(k)}">Ещё ${rows.length-limit}</button>`:''}</div>`;}).join('')}</section>`;
  }).join('')}`;
  $('matrix').style.width=Math.max(vp.clientWidth,rail+viewEpics.length*col)+'px';syncScroll();
 }
 function syncScroll(){const vp=$('viewport'),max=Math.max(0,vp.scrollWidth-vp.clientWidth),range=$('horizontal-scroll');range.disabled=max===0;range.value=max?Math.round(vp.scrollLeft/max*10000):0;range.style.setProperty('--thumb',Math.max(24,Math.min(140,range.clientWidth*vp.clientWidth/Math.max(1,vp.scrollWidth)))+'px');$('scroll-left').disabled=vp.scrollLeft<1;$('scroll-right').disabled=vp.scrollLeft>=max-1;$('scroll-label').textContent=viewEpics.length?viewEpics.length+' эпиков':'';}
 function tags(){const list=[];if(state.hideCompleted)list.push(['hideCompleted','Проекты < 100%']);for(const k of ['stakeholder','direction','stream','department','ba','project'])if(state[k].length)list.push([k,tabs[k]+': '+state[k].length]);for(const prefix of ['project','epic'])if(state[prefix+'Min']!==0||state[prefix+'Max']!==100)list.push([prefix+'Range',(prefix==='project'?'Проекты':'Эпики')+': '+state[prefix+'Min']+'–'+state[prefix+'Max']+'%']);return list;}
 function render(resetPosition=false){
  if(!model)return;viewGroups=M.groups(model,state);viewEpics=viewGroups.flatMap(p=>p.epics);const count=viewEpics.reduce((n,e)=>n+e.visible.length,0);
  $('counts').textContent=`${viewGroups.length} проектов · ${viewEpics.length} эпиков · ${count} историй`;
  $('project-year').textContent='Год проектов · '+(state.projectYear||'Все');$('project-year').classList.toggle('active',!!state.projectYear);
  $('story-period').textContent='Период историй · '+(state.periods.length===1?periodLabel(state.periods[0]):state.periods.length||'Все');$('story-period').classList.toggle('active',!!state.periods.length);
  $('orphan-view').textContent='Без эпика · '+(model.epics.get('unassigned')?.stories.length||0);$('orphan-view').classList.toggle('active',state.orphanOnly);
  $('issues-view').classList.toggle('active',state.issuesOnly);$('active-tags').innerHTML=tags().map(([k,v])=>`<button class="tag" data-clear="${k}" title="Снять условие">${escape(v)} ×</button>`).join('');
  $('reset').disabled=!hasChanges();$('search').value=state.search;expanded=resetPosition?new Set():expanded;windowKey='';
  $('matrix').style.setProperty('--cols',viewEpics.length);
  if(resetPosition){$('viewport').scrollLeft=0;$('viewport').scrollTop=0;}
  if(!viewEpics.length){$('matrix').innerHTML='';$('matrix').style.width='100%';$('message').hidden=false;$('message').className='message';$('message').textContent='По выбранным условиям нет историй или эпиков. Измените фильтры или нажмите «Сбросить».';syncScroll();return;}
  $('message').hidden=true;renderWindow(true);
 }
 function openFilters(key='stakeholder'){if(!model)return;draft=structuredClone(state);tab=key;optionSearch='';renderFilters();$('filter-dialog').showModal();}
 function renderFilters(){
  $('filter-tabs').innerHTML=Object.entries(tabs).map(([k,label])=>`<button data-tab="${k}" aria-selected="${k===tab}"><span>${label}</span><small>${Array.isArray(draft[k])?draft[k].length||'':k==='projectYear'?draft[k]:''}</small></button>`).join('');
  if(tab==='readiness'){$('filter-pane').innerHTML=`<h3>Готовность проектов и эпиков</h3><p class="help">Независимые диапазоны. Проценты не пересчитываются при фильтрации историй.</p>${['project','epic'].map(p=>`<div class="range-group"><strong>${p==='project'?'Проекты':'Эпики'}</strong>${['Min','Max'].map((bound,i)=>`<label class="range-inputs">${i?'До':'От'}<input type="range" min="0" max="100" step="0.1" value="${draft[p+bound]}" data-range="${p+bound}" aria-label="${p==='project'?'Проекты':'Эпики'}: ${i?'до':'от'} процентов"><input type="number" min="0" max="100" step="0.1" value="${draft[p+bound]}" data-number="${p+bound}" aria-label="${p==='project'?'Проекты':'Эпики'}: ${i?'максимум':'минимум'}"></label>`).join('')}</div>`).join('')}<label class="option"><input type="checkbox" data-flag="hideCompleted" ${draft.hideCompleted?'checked':''}><span>Скрывать проекты с готовностью 100%</span></label><p class="help">Без рассчитанного процента: показываются при полном диапазоне 0–100%; при сужении диапазона скрываются.</p>`;return;}
  const help=tab==='projectYear'?'Достаточно одной истории с положительной утилизацией в году. В проект включаются все его эпики и истории — затем применяются остальные фильтры.':tab==='periods'?'Останутся истории с положительной утилизацией хотя бы в одном выбранном месяце или квартале. Независимо от года проектов. Кварталы объединяют месячный факт.':'Можно выбрать несколько значений. Внутри списка — любое из выбранных; между фильтрами — пересечение.';
  $('filter-pane').innerHTML=`<h3>${tabs[tab]}</h3><p class="help">${help}</p><input class="options-search" id="option-search" type="search" placeholder="Найти значение…" aria-label="Поиск по значениям фильтра" value="${escape(optionSearch)}"><div class="filter-tools"><button data-filter-clear="true">${tab==='projectYear'?'Все годы':'Снять выбор'}</button></div><div class="options-list" id="options-list"></div>`;
  renderOptions();$('option-search').addEventListener('input',e=>{optionSearch=e.target.value;renderOptions();});
 }
 function renderOptions(){const values=M.options(model,tab).filter(v=>(tab==='periods'?periodLabel(v):v).toLocaleLowerCase('ru').includes(optionSearch.toLocaleLowerCase('ru')));$('options-list').innerHTML=values.length?values.map(v=>`<label class="option"><input type="${tab==='projectYear'?'radio':'checkbox'}" name="facet" value="${escape(v)}" data-option="true" ${(tab==='projectYear'?draft[tab]===v:draft[tab].includes(v))?'checked':''}><span>${escape(tab==='periods'?periodLabel(v):v)}</span></label>`).join(''):'<p class="help">Нет подходящих значений.</p>';}
 const row=(k,v)=>`<dt>${escape(k)}</dt><dd>${escape(v??'—')}</dd>`;
 function openStory(id){const s=model.stories.get(id);if(!s)return;const e=model.epics.get(s.epic_id);$('detail-id').textContent='#'+s.id;$('detail-body').innerHTML=`<h2 class="detail-title" id="detail-title">${escape(s.title)}</h2><p class="detail-path">${escape(s.project)} → ${escape(e.title)}</p>${bar(s.pct,'Готовность истории')}<dl class="detail-grid">${row('Статус',s.status)}${row('Аналитик',s.ba||'—')}${row('SP',fmt(s.sp))}${row('Освоено SP',fmt(s.used))}${row('Стейкхолдер',s.stakeholder||'—')}${row('Направление',s.facets.direction.join('; ')||'—')}${row('Стрим',s.stream||'—')}${row('Отдел',s.department||'—')}${row('Обновлено в Pyrus',date(s.modified_at))}</dl>${s.issues.map(i=>`<p class="warning">${escape(i)}</p>`).join('')}${[['Я как…',s.i_as],['Хочу…',s.want],['Чтобы…',s.so_that]].filter(([,v])=>v).map(([k,v])=>`<div class="text-block"><strong>${k}</strong>${escape(v)}</div>`).join('')}${s.months.length?`<table class="sprint-table"><caption>Месячный факт</caption><thead><tr><th>Месяц</th><th>Старт %</th><th>Конец %</th><th>Освоено SP</th></tr></thead><tbody>${s.months.map(m=>`<tr><td>${escape(m.month)}</td><td>${fmt(m.start)}</td><td>${fmt(m.end)}</td><td>${fmt(m.sp_utilized)}</td></tr>`).join('')}</tbody></table>`:''}<p class="text-block"><a href="https://pyrus.sovcombank.ru/t#id${s.id}" target="_blank" rel="noopener noreferrer">Открыть историю в Pyrus ↗</a></p>`;$('detail').showModal();}
 function openEpic(id){const e=model.epics.get(id);if(!e)return;$('detail-id').textContent=e.code||'Эпик';$('detail-body').innerHTML=`<h2 class="detail-title" id="detail-title">${escape(e.title)}</h2><p class="detail-path">${escape(e.project)}</p>${bar(e.pct,'Готовность эпика')}${e.titleMissing&&!e.missing?'<p class="warning">Название epic ещё не загружено. Выполните разовое заполнение названий из комплекта.</p>':''}<dl class="detail-grid">${row('Историй всего',e.stories.length)}${row('Историй по фильтрам',viewEpics.find(v=>v.id===id)?.visible.length??0)}${row('SP эпика',fmt(e.sp))}${row('Освоено SP',fmt(e.used))}${row('Осталось SP',fmt(e.sp_undone))}${row('Начало',e.start)}${row('Завершение',e.end)}${row('Возраст, дней',e.maturity_days)}${row('Код задачи эпика',e.reference)}</dl><p class="text-block">${escape(e.description||'')}</p>${/^\d+$/.test(id)?`<a href="https://pyrus.sovcombank.ru/t#id${id}" target="_blank" rel="noopener noreferrer">Открыть эпик в Pyrus ↗</a>`:''}`;$('detail').showModal();}
 async function load(){if(loading)return;loading=true;$('refresh').disabled=true;$('connection').textContent='Обновление…';try{const response=await fetch('/api/story-map',{cache:'no-store',signal:AbortSignal.timeout(70000)});let data;try{data=await response.json();}catch{throw new Error('Сервер вернул не JSON. Проверьте вебхук Story Map.');}if(!response.ok)throw new Error(data.error||'HTTP '+response.status);model=M.build(data);render(true);$('connection').textContent='Срез: '+date(model.generatedAt);}catch(e){$('message').hidden=false;$('message').className='message error';$('message').textContent=e.name==='TimeoutError'?'Истекло время ожидания вебхука n8n.':e.message;$('connection').textContent=model?'На экране предыдущий срез':'Нет соединения';}finally{loading=false;$('refresh').disabled=false;}}
 $('search').addEventListener('input',e=>{state.search=e.target.value;clearTimeout(searchTimer);searchTimer=setTimeout(()=>{render(true);save();},180);});
 $('project-year').addEventListener('click',()=>openFilters('projectYear'));$('story-period').addEventListener('click',()=>openFilters('periods'));$('filters-button').addEventListener('click',()=>openFilters());
 $('cancel-filters').addEventListener('click',()=>$('filter-dialog').close());$('apply-filters').addEventListener('click',()=>{Object.assign(state,draft);$('filter-dialog').close();render(true);save();});$('reset-draft').addEventListener('click',()=>{draft=M.defaults();optionSearch='';renderFilters();});
 $('filter-tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;optionSearch='';renderFilters();}});
 $('filter-pane').addEventListener('click',e=>{if(e.target.closest('[data-filter-clear]')){draft[tab]=tab==='projectYear'?'':[];renderFilters();}});
 $('filter-pane').addEventListener('change',e=>{const el=e.target;if(el.dataset.option){if(tab==='projectYear')draft[tab]=el.value;else draft[tab]=el.checked?[...new Set([...draft[tab],el.value])]:draft[tab].filter(v=>v!==el.value);}if(el.dataset.flag)draft[el.dataset.flag]=el.checked;if(el.dataset.number)setRange(el.dataset.number,el.value);});
 function setRange(key,value){const n=Number(value);if(!Number.isFinite(n))return;draft[key]=Math.max(0,Math.min(100,n));const p=key.startsWith('project')?'project':'epic';if(key.endsWith('Min'))draft[p+'Max']=Math.max(draft[p+'Max'],draft[key]);else draft[p+'Min']=Math.min(draft[p+'Min'],draft[key]);for(const k of [p+'Min',p+'Max'])for(const q of [`[data-range="${k}"]`,`[data-number="${k}"]`]){const el=$('filter-pane').querySelector(q);if(el)el.value=draft[k];}}
 $('filter-pane').addEventListener('input',e=>{if(e.target.dataset.range)setRange(e.target.dataset.range,e.target.value);else if(e.target.dataset.number&&e.target.value!=='')setRange(e.target.dataset.number,e.target.value);});
 $('reset').addEventListener('click',()=>{clearTimeout(searchTimer);Object.assign(state,M.defaults());render(true);save();});
 $('orphan-view').addEventListener('click',()=>{state.orphanOnly=!state.orphanOnly;render(true);save();});$('issues-view').addEventListener('click',()=>{state.issuesOnly=!state.issuesOnly;render(true);save();});
 $('active-tags').addEventListener('click',e=>{const key=e.target.closest('[data-clear]')?.dataset.clear;if(!key)return;if(key==='hideCompleted')state.hideCompleted=false;else if(key.endsWith('Range')){const p=key.slice(0,-5);state[p+'Min']=0;state[p+'Max']=100;}else state[key]=[];render(true);save();});
 $('matrix').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.lane){state.collapsed[d.lane]=!state.collapsed[d.lane];renderWindow(true);$('matrix').querySelector(`[data-lane="${d.lane}"]`)?.focus({preventScroll:true});save();}else if(d.story)openStory(d.story);else if(d.epic)openEpic(d.epic);else if(d.more){expanded.add(d.more);renderWindow(true);}});
 $('viewport').addEventListener('scroll',()=>{if(!raf)raf=requestAnimationFrame(()=>{raf=0;renderWindow();});});
 $('horizontal-scroll').addEventListener('input',e=>{const vp=$('viewport');vp.scrollLeft=Number(e.target.value)/10000*Math.max(0,vp.scrollWidth-vp.clientWidth);renderWindow();});
 for(const [id,sign]of [['scroll-left',-1],['scroll-right',1]])$(id).addEventListener('click',()=>{$('viewport').scrollLeft+=sign*dimensions().col*2;renderWindow();});
 window.addEventListener('resize',()=>renderWindow(true));$('refresh').addEventListener('click',load);$('close-detail').addEventListener('click',()=>$('detail').close());
 for(const id of ['detail','filter-dialog'])$(id).addEventListener('click',e=>{if(e.target===$(id)){const r=$(id).getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$(id).close();}});
 load();
})();
</script>
</body></html>
